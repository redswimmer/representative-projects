# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: 'Phase 2: propose one representative project from verified problems'
sharing: false

prompts:
  - file://prompts/propose.txt

providers:
  - file://../providers.yaml

defaultTest:
  vars:
    schema: file://schema.json # the same file is-json validates against
  assert:
    - type: is-json
      value: file://schema.json
      metric: schema_adherence
    - type: python
      value: file://asserts/integrity.py
      metric: integrity
    - type: not-contains
      value: '```'
      metric: no_code

tests:
  - path: file://generate_tests.py:generate_tests
    config:
      fixtures_dir: fixtures
      job_listings_dir: ../../job_listings
